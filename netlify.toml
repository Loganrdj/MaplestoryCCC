# Static site: no build step, serve the repo root.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# Always check for a newer version, so a fresh deploy shows up on the next refresh.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
